name: ZWU Auto BOOK

on:
  workflow_dispatch:  # 支持手动触发
    inputs:
      dry_run:
        description: 'DRY RUN：只验证登录，不发起预约（不会占座、不发通知）'
        type: boolean
        default: false
  # schedule:
  #   - cron: '57 12 * * *'  # UTC 12:57 = 北京时间 20:57（已改用 cron-job.org 触发，见 README）

permissions:
  contents: read

jobs:
  auto-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'    # 缓存 pip 依赖，每次运行省 20~30 秒安装时间

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto BOOK
        env:
          DRY_RUN: ${{ inputs.dry_run }}                  # 手动触发时的 DRY RUN 开关（只验证登录）
          SCKEY: ${{ secrets.SCKEY }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}              # 老用法（后向兼容，保留）
          ACCOUNTS_CONFIG: ${{ vars.ACCOUNTS_CONFIG }}    # 新用法：明文 Variable（账号清单 + 覆盖配置）
          PASSWORDS: ${{ secrets.PASSWORDS }}             # 新用法：密码映射 Secret（{学号: 密码}）
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}     # 飞书方案：应用 App ID
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}  # 飞书方案：应用 App Secret
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}    # 飞书方案：多维表格 app_token
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}      # 飞书方案：多维表格 table_id
          FEISHU_PASSWORD_TABLE_ID: ${{ secrets.FEISHU_PASSWORD_TABLE_ID }}  # 飞书方案：密码表 table_id（可选，未配置则用 PASSWORDS）
        run: python demo.py
