# ============================================
# 预约参数配置
# ============================================

# 自习室编号: 0=112, 1=113, 2=114, 3=212, 4=213, 5=214, 6=312, 7=313, 8=314
room_id: 2

# 延后天数: 1=明天, 2=后天
dday: 2

# 开始时间: 8=8:00, 12=12:00, 21=21:00
begin: 12

# 持续时长（小时）
duration: 9

# 指定座位ID列表，留空或设为 null 则随机选座
# 查看座位ID: python seatmap.py <自习室编号> <座位号>，或打开 zwu_lib.xlsx
seat_ids:
  - 12920
  - 12921

# 指定座位号列表（选座页显示的编号，自动转换为座位ID），如 [113, 114]
# 与 seat_ids 同时配置时以 seat_ids 为准
seats: null

# ============================================
# 抢座策略
# ============================================

# 重试节奏：抢座分两轮，两轮的节奏不同。
#
#   第一轮：所有账号各出手【一次】（固定 max_retry=1，不看下面的配置），
#           目的是让每个号都在开抢瞬间摸到牌，不让前面的号把后面的号堵住。
#
#   第二轮：只给第一轮失败的号补抢，跳过探路、直接猛攻。
#           因为补抢时系统必然已经开放，再"温和试探"只是把有限的次数
#           白白耗在等待上。
#
# 于是下面的探路参数只影响…实际上现在没有任何轮次使用探路间隔了 —— 保留
# 这些参数是为了万一将来需要恢复"程序早于开放时刻启动、先温和试探"的用法。
# ⚠️ 将来若恢复探路，务必保证 max-retry >= retry-probe-count，否则探路会被
#    min(probe_count, max_retry) 静默截断。
retry-probe-interval: 10   # 探路间隔（秒）—— 当前无轮次使用，保留备用
retry-probe-count: 30      # 探路次数上限 —— 当前无轮次使用，保留备用
retry-rush-interval: 3     # 猛攻间隔（秒）
retry-rush-duration: 60    # 猛攻持续时长（秒），用于换算猛攻次数

# 补抢轮的出手次数上限（第一轮固定各 1 次，不受此值影响）。
# 当前 3 → 每号总共最多出手 1 + 3 = 4 次，最坏约 6 秒。
# ⚠️ 这个值直接决定"一个号会占住后面的号多久"：串行下 14 个号全失败时，
#    总耗时 ≈ 14 × (max-retry - 1) × retry-rush-interval。
#    取 3 → 约 84 秒；取 6 → 约 210 秒；取 20 → 约 798 秒。
max-retry: 3

# ============================================
# 登录重试（应对站点偶发慢响应）
# ============================================
# 实测约 10% 概率出现「登录超时，仍未跳出登录页」，但同一账号重跑通常就能成功，
# 并非账号或密码问题。开启重试可自动救回，避免整批里白白少一个号。
# 每次重试都会**重建全新浏览器实例**（卡住的会话无法复用）。
login-retry: 2        # 登录失败后的额外重试次数（总尝试 = 1 + 该值）
login-retry-wait: 3   # 两次登录尝试之间的等待（秒）

# 抢座阶段的并发账号数。
#   1 = 挨个发请求（最保守，请求特征与旧版完全一致，没有任何并发）← 当前默认值
#   3 = 三个一批（14 个账号出手时间从约 14 秒压到约 5 秒）
#
# 升级路径：保持 1 先真跑一次，确认「两阶段调度」正常、且登录后隔一段时间抢座仍然有效；
#           确认无误后再改成 3。任何时候改回 1 即可退回最保守状态，无需改动代码。
# 登录阶段始终是逐个进行，并发只作用在最轻的抢座请求上。
concurrency: 1

# 并发时各账号出手的随机错开上限（秒）。设为 0 表示不错开。
# 仅在 concurrency > 1 时生效（串行时无需错开）。
# 作用：并发的账号本来会在同一瞬间发出请求，错开后落在 0~0.8 秒的不同时刻，
#       时间上散开比"完全同时"更接近真人行为，可降低被识别为异常的特征。
concurrency-jitter: 0.8

# 已废弃：脚本启动后直接开始预约，该参数不再产生等待行为
cron-delta-minutes: 5

# ============================================
# 通知配置（可选，留空则不通知）
# ============================================

# 通知方式: none / wechat / email
notification_type: wechat

# Server酱微信推送（notification_type=wechat 时生效）
# 获取 SCKEY: https://sct.ftqq.com/
sckey: ''

# 邮件通知（notification_type=email 时生效）
smtp:
  server: smtp.office365.com
  from_addr: ''
  password: ''
  to_addr: ''
